<main id="screen-processing" class="screen flex active min-h-screen flex-col items-center justify-center px-6 pt-32 pb-20 relative overflow-hidden">
    <!-- Background Ambient Element -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
    
    <!-- Progress Container -->
    <div class="w-full max-w-3xl z-10">
        <!-- Header Status -->
        <div class="flex flex-col md:flex-row justify-between items-end gap-4 mb-12">
            <div class="flex flex-col gap-1">
                <span class="font-label text-[10px] uppercase tracking-[0.3em] text-primary/80 font-bold">Current Operation</span>
                <h1 class="font-headline text-4xl font-extrabold tracking-tight text-white flex items-baseline gap-3">
                    Optimizing <span id="processing-index" class="text-primary/40 text-2xl font-normal tracking-normal">-/-</span>
                </h1>
            </div>
            <div class="flex flex-col items-end gap-1">
                <span class="font-label text-[10px] uppercase tracking-[0.3em] text-on-surface-variant">Time remaining</span>
                <span class="font-headline text-2xl font-bold text-white tabular-nums">12s</span>
            </div>
        </div>
        
        <!-- Main Interactive Card -->
        <div class="glass-panel rounded-xl p-8 md:p-12 shadow-2xl relative overflow-hidden">
            <!-- Active File Info -->
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded bg-surface-container-highest flex items-center justify-center border border-outline-variant/20">
                        <span class="material-symbols-outlined text-primary text-2xl">image</span>
                    </div>
                    <div>
                        <p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant mb-0.5">Processing File</p>
                        <p id="processing-filename" class="font-headline font-bold text-white tracking-tight">Loading...</p>
                    </div>
                </div>
                <div class="text-right">
                    <p id="processing-percentage" class="font-headline text-3xl font-black text-primary tracking-tighter">0<span class="text-lg opacity-60">%</span></p>
                </div>
            </div>
            
            <!-- Sleek High-End Progress Bar -->
            <div class="relative h-4 w-full bg-surface-container-lowest rounded-full overflow-hidden border border-outline-variant/10">
                <div class="absolute inset-0 bg-gradient-to-r from-primary/5 to-transparent"></div>
                <div id="processing-bar" class="absolute top-0 left-0 bottom-0 w-[0%] bg-gradient-to-r from-primary-container to-primary progress-glow transition-all duration-500 ease-out rounded-r-sm">
                    <div class="absolute top-0 right-0 bottom-0 w-32 bg-gradient-to-r from-transparent via-white/40 to-transparent skew-x-[30deg] translate-x-full"></div>
                </div>
            </div>
            
            <!-- Real-time Precision Metrics Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mt-10">
                <div class="flex flex-col gap-1">
                    <p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Ratio</p>
                    <p class="font-headline text-lg font-bold text-white">4.2:1</p>
                </div>
                <div class="flex flex-col gap-1 border-l border-outline-variant/20 pl-6">
                    <p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Output</p>
                    <p id="processing-output-size" class="font-headline text-lg font-bold text-white">-</p>
                </div>
                <div class="flex flex-col gap-1 border-l border-outline-variant/20 pl-6">
                    <p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Buffer</p>
                    <p class="font-headline text-lg font-bold text-white">Active</p>
                </div>
                <div class="flex flex-col gap-1 border-l border-outline-variant/20 pl-6">
                    <p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Core Load</p>
                    <p class="font-headline text-lg font-bold text-white">88%</p>
                </div>
            </div>
        </div>
        
        <!-- Action Area -->
        <div class="mt-12 flex justify-center">
            <button id="cancel-processing-btn" class="group flex items-center gap-3 px-8 py-3 rounded-full border border-outline-variant/20 hover:bg-error-container/10 hover:border-error/40 transition-all duration-300">
                <span class="material-symbols-outlined text-on-surface-variant group-hover:text-error transition-colors">cancel</span>
                <span class="font-label text-xs uppercase tracking-[0.2em] font-bold text-on-surface-variant group-hover:text-error">Cancel Process</span>
            </button>
        </div>
    </div>
    
    <!-- Asymmetric Detail Images -->
    <div class="absolute -bottom-20 -left-20 w-80 h-80 opacity-10 pointer-events-none grayscale">
        <img alt="Technical optical lens macro" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC1jbaa6TvPLaKJgTE5P0UJQGz2UtOaRvPaj1DL4n_ZBdKYnBb7cFAzpadhy1GLOL1ymuHbdH2oamLSSoylwnKjV6b8FlSLNl_JNjUnNcd84FlPK28ywXiUjkfpmZQz6QCQeI_iF6RHXnPl2wKK4sBm2Ta5La6UCoJjVOzIOuv4mVkNJsJ9H58WDEs2A5ZIyIEfniRKoFJQwkCP8aNWZmkS-9AelFEoxveLywxEGkBo9QdePodBZIrL5DNrhhKUDddyNxmWDz5BiH_T"/>
    </div>
    <div class="absolute -top-10 -right-20 w-64 h-64 opacity-10 pointer-events-none grayscale">
        <img alt="Data visualization abstract" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC4MLbNf2wjb1OtLouyGfWc4S3Rt4zK_o5Gw9bBm4gSGOacgmxt8cW20D3X8zKCdQbdRop1TtMx9EuzTOLWcsYfSj0Ml8s4Xf97JDsEiAn6jJ3Hlp6Dfl5NFbi4cYVsqn8M4oJDvZqkBzbRnVTI33nnfINFlYx4tv-5hudrhTksSCfi9ri7XHpIpzXZ66lcKx0ArbDJeohpYjmf3VoXSK8k4t_FCkS-zHiAksxo7M9jrmjhAyndzLoZ4ZN2bjHgk9VJC0RY2pHO8ocy"/>
    </div>
</main>
